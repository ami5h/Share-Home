<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Share Home</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="toasts"></div>

<div id="auth-modal" class="auth-overlay hidden">
  <div class="auth-card">
    <h2>Token Required</h2>
    <p class="auth-hint">Enter your auth token to access Share Home from outside your LAN.</p>
    <form id="auth-form">
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="10" height="7" rx="2"/>
          <path d="M5 7V5a3 3 0 016 0v2"/>
          <circle cx="8" cy="10" r="1"/>
        </svg>
        <input type="password" id="auth-input" placeholder="Auth token" autocomplete="off" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;margin-top:8px">Save &amp; Continue</button>
    </form>
    <p class="auth-error hidden" id="auth-error">Invalid token. Try again.</p>
  </div>
</div>

<header class="app-header">
  <div class="header-content">
    <div class="brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </div>
      <h1>Share Home</h1>
    </div>
    <div class="header-actions">
      <button id="theme-btn" class="btn-theme" title="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="3.5"/>
          <line x1="9" y1="1" x2="9" y2="3"/>
          <line x1="9" y1="15" x2="9" y2="17"/>
          <line x1="1" y1="9" x2="3" y2="9"/>
          <line x1="15" y1="9" x2="17" y2="9"/>
          <line x1="3.3" y1="3.3" x2="4.7" y2="4.7"/>
          <line x1="13.3" y1="13.3" x2="14.7" y2="14.7"/>
          <line x1="3.3" y1="14.7" x2="4.7" y2="13.3"/>
          <line x1="13.3" y1="4.7" x2="14.7" y2="3.3"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M15.1 9.9A6.5 6.5 0 018.1 2.9 7 7 0 109.1 15.1a6.5 6.5 0 006-5.2z"/>
        </svg>
      </button>
      <button id="paste-btn" class="btn-paste" title="Paste from clipboard">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="12" height="11" rx="2"/>
          <path d="M7 4V2.5A1.5 1.5 0 018.5 1h1A1.5 1.5 0 0111 2.5V4"/>
          <line x1="7" y1="7" x2="11" y2="7"/>
          <line x1="7" y1="10" x2="11" y2="10"/>
        </svg>
        <span>Paste</span>
      </button>
    </div>
  </div>
</header>

<main class="container">
  <!-- Upload -->
  <section class="card upload-card">
    <div id="drop-zone" class="drop-zone">
      <input type="file" id="file-input" multiple>
      <label id="drop-label" class="drop-zone-label" for="file-input">
        <div class="drop-content">
          <div class="drop-icon">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="4" width="28" height="32" rx="4"/>
              <path d="M14 14h12M14 20h8"/>
              <circle cx="20" cy="28" r="2"/>
            </svg>
          </div>
          <p class="drop-title">Drop files here</p>
          <p class="drop-subtitle">or <span class="link-btn">browse</span></p>
        </div>
      </label>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <label style="font-size:12px;color:var(--text-secondary)">Expires:</label>
      <select id="expires-select" style="font:var(--font);font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-card-solid);color:var(--text-primary)">
        <option value="">Never</option>
        <option value="1h">1 hour</option>
        <option value="1d">1 day</option>
        <option value="1w">1 week</option>
      </select>
    </div>
  </section>

  <!-- Paste -->
  <section class="card">
    <h2>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="section-icon">
        <rect x="3" y="3" width="12" height="12" rx="2"/>
        <path d="M7 3h4M7 3V1M11 3V1"/>
      </svg>
      Clipboard
    </h2>
    <p class="card-hint">Press <kbd>&#8984;V</kbd> or tap <strong>Paste</strong> above</p>
    <div id="paste-preview" class="preview-area hidden"></div>
  </section>

  <!-- URL Shortener -->
  <section class="card">
    <h2>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="section-icon">
        <path d="M8 3L6 6M10 3L12 6M9 6v6"/>
        <path d="M3.5 6h11a2.5 2.5 0 010 5H7a2.5 2.5 0 010-5z"/>
      </svg>
      Shorten URL
    </h2>
    <form id="url-form" class="url-form">
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 11.5l1.5-1.5a3.5 3.5 0 005-0.5l1.5-1.5"/>
        </svg>
        <input type="url" id="url-input" placeholder="Paste a long URL" required autocomplete="off">
        <button type="submit" class="btn-primary">Shorten</button>
      </div>
      <div id="url-result" class="url-result hidden">
        <a id="url-result-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button type="button" class="btn-icon" id="url-copy-btn" title="Copy">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="5" width="8" height="8" rx="1.5"/>
            <path d="M10 5V3.5A1.5 1.5 0 008.5 2h-5A1.5 1.5 0 002 3.5v5A1.5 1.5 0 003.5 9H5"/>
          </svg>
        </button>
        <button type="button" class="btn-icon" id="url-qr-btn" title="QR Code">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="4" height="4" rx="0.5"/>
            <rect x="10" y="2" width="4" height="4" rx="0.5"/>
            <rect x="2" y="10" width="4" height="4" rx="0.5"/>
            <rect x="10" y="10" width="1.5" height="1.5" rx="0.25"/>
            <rect x="12.5" y="10" width="1.5" height="1.5" rx="0.25"/>
            <rect x="10" y="12.5" width="1.5" height="1.5" rx="0.25"/>
            <rect x="12.5" y="12.5" width="1.5" height="1.5" rx="0.25"/>
          </svg>
        </button>
      </div>
    </form>
  </section>

  <!-- History -->
  <section class="card history-card">
    <h2>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="section-icon">
        <circle cx="9" cy="9" r="7"/>
        <polyline points="9 5 9 9 12 11"/>
      </svg>
      History
    </h2>
    <div id="storage-bar" class="storage-bar hidden">
      <span id="storage-text" class="storage-text"></span>
      <div class="storage-track">
        <div id="storage-fill" class="storage-fill"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="files">Files</button>
      <button class="tab" data-tab="clipboard">Clipboard</button>
      <button class="tab" data-tab="links">Links</button>
    </div>
    <div id="bulk-toolbar" class="bulk-toolbar hidden">
      <button class="btn-sm">Select All</button>
      <button class="btn-sm btn-danger">Delete Selected</button>
      <button class="btn-sm" id="bulk-zip-btn">Download ZIP</button>
      <span id="bulk-count" class="bulk-count"></span>
    </div>
    <div id="tab-files" class="tab-panel">
      <input type="text" class="search-input" id="search-files" placeholder="Search files...">
      <ul id="files-list" class="history-list"></ul>
      <div id="files-skeleton" class="skeleton-group hidden"></div>
      <p class="empty-hint" id="files-empty">No files yet</p>
    </div>
    <div id="tab-clipboard" class="tab-panel hidden">
      <input type="text" class="search-input" id="search-clipboard" placeholder="Search clipboard...">
      <ul id="clipboard-list" class="history-list"></ul>
      <div id="clipboard-skeleton" class="skeleton-group hidden"></div>
      <p class="empty-hint" id="clipboard-empty">No clipboard entries yet</p>
    </div>
    <div id="tab-links" class="tab-panel hidden">
      <input type="text" class="search-input" id="search-links" placeholder="Search links...">
      <ul id="links-list" class="history-list"></ul>
      <div id="links-skeleton" class="skeleton-group hidden"></div>
      <p class="empty-hint" id="links-empty">No links yet</p>
    </div>
  </section>
</main>

<div id="upload-progress" class="progress-overlay hidden">
  <div class="progress-label">Uploading...</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar"></div>
  </div>
</div>

<script src="/config.js"></script>
<script src="/qrcode.js"></script>
<script src="/app.js"></script>
</body>
</html>
