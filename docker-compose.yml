services:
  share-home:
    build:
      context: .
      dockerfile: go/Dockerfile
    container_name: share-home-app
    environment:
      - SMB_HOST=${SMB_HOST}
      - SMB_SHARE=${SMB_SHARE}
      - SMB_USERNAME=${SMB_USERNAME}
      - SMB_PASSWORD=${SMB_PASSWORD}
      - SMB_BASE_DIR=share-home
      - SMB_ENCRYPT_KEY=${SMB_ENCRYPT_KEY}
      - AUTH_TOKEN=${AUTH_TOKEN}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8080,https://localhost:8080}
      - DB_PATH=/data/share-home.db
      - LISTEN_ADDR=:8080
    volumes:
      - app-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  app-data:
